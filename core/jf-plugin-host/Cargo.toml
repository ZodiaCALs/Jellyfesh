[package]
name = "jf-plugin-host"
description = "Plugin host: wasmtime components, sandboxed host imports, packages and signatures, auth flows, search merge."
version.workspace = true
edition.workspace = true
# wasmtime 48 (the LTS line, ADR-0003) needs Rust 1.95.
rust-version = "1.95"
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Types, packages, manifests, merge, answer checks, the login machine and host crypto.
jf-plugin-model = { workspace = true, features = ["crypto"] }
wasmtime.workspace = true
ureq = { workspace = true, features = ["platform-verifier"] }
cookie_store.workspace = true
cookie.workspace = true
rustls = { workspace = true, features = ["logging"] }
url.workspace = true
# The cookie jar on disk.
aes-gcm.workspace = true
getrandom.workspace = true
base64.workspace = true
zeroize.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
wit-component.workspace = true
sha2.workspace = true
zip.workspace = true
