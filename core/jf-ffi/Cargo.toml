[package]
name = "jf-ffi"
description = "Foreign-language bindings for jf-core: UniFFI for Swift and Kotlin, a JSON C ABI for C#."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "jf_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[lints]
workspace = true

[dependencies]
jf-core.workspace = true
# Only for type names that jf-core does not re-export (TrackRef::Source's SourceTrack, the
# lyric model's enums, Track's ReplayGain); all behaviour goes through jf-core.
jf-library.workspace = true
jf-lyrics.workspace = true
jf-session.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uniffi.workspace = true
# Android: the JNI entry that hands the app's Context to ndk-context (src/android.rs). Built on
# every platform (both are small and pure Rust) so the JVM tests exercise the same code.
jni-sys.workspace = true
ndk-context.workspace = true
# On-device recognition for AI Lyrics (ADR-0019 §5): the apps get whisper.cpp's recogniser as
# `Config::speech`. Without the feature (below), `jf_speech::recognizer()` is `None` and AI
# Lyrics offers only its online mode.
jf-speech = { path = "../jf-speech", default-features = false }

# whisper.cpp is built (CMake, and bindgen with libclang) for every target the apps ship except
# Windows on Arm, where its build is not supported yet.
[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
jf-speech = { path = "../jf-speech", default-features = false, features = ["whisper"] }

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true
