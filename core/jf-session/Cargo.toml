[package]
name = "jf-session"
description = "Playback session: queue, shuffle with history, repeat modes, persistence and restore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The session store (feature `sqlite`, on by default). Jellyfesh Web (core/jf-web) builds the
# queue for wasm32-unknown-unknown without it.
rusqlite = { workspace = true, optional = true }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
