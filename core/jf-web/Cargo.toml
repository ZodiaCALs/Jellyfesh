[package]
name = "jf-web"
description = "Jellyfesh Web's core in WebAssembly: the queue and playback rules, settings, plugin answer checks, search merging, sign-in flows and lyrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

# Built for wasm32-unknown-unknown and bound with wasm-bindgen by platforms/web
# (scripts/build-wasm.mjs); the rlib lets the host-side tests use it.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# Without its SQLite store (the workspace entry keeps the default features on).
jf-session = { path = "../jf-session", default-features = false }
jf-lyrics.workspace = true
jf-palette.workspace = true
jf-tokens.workspace = true
jf-plugin-model.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
# Comparing a bundled plugin's version with one installed from a file.
semver.workspace = true
# The library's text matching (mirrors jf-library).
unicode-normalization.workspace = true
url.workspace = true
wasm-bindgen.workspace = true
zeroize.workspace = true

# The queue's shuffle seed comes from rand, which needs the browser's
# crypto.getRandomValues on this target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

# The mirrored rules are compared with the originals on the host.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
jf-core.workspace = true
jf-engine.workspace = true
jf-library.workspace = true
