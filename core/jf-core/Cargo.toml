[package]
name = "jf-core"
description = "The app facade: commands in, state snapshots and events out, on one actor thread."
version.workspace = true
edition.workspace = true
# The plugin host's wasmtime (48, the LTS line) needs Rust 1.95.
rust-version = "1.95"
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jf-lyrics.workspace = true
jf-palette.workspace = true
jf-library.workspace = true
jf-engine.workspace = true
jf-session.workspace = true
jf-tokens.workspace = true
jf-plugin-host.workspace = true
blake3.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Comparing a bundled plugin's version with the installed one.
semver.workspace = true
# Fetching a source track's artwork for theme colours and backdrops (the engine streams
# audio with its own agent); TLS as the engine sets it up: ring, the OS root store.
ureq.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
url.workspace = true

# The system keystore where the platform has one `keyring` supports (ADR-0015); Android
# and iOS apps pass their own store.
[target.'cfg(any(target_os = "macos", target_os = "windows", all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android")))))'.dependencies]
keyring.workspace = true

[dev-dependencies]
tempfile.workspace = true
hound.workspace = true
image.workspace = true
# The source tests build the test plugins into components, as the plugin host's tests do.
wit-component.workspace = true
flacenc.workspace = true
# Tags for library files that unified search merges with source results.
lofty.workspace = true
