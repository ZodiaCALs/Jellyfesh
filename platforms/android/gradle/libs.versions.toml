# Versions checked on 2026-11-07 (latest stable of each):
# AGP 9.5.0 (needs Gradle 9.6+, the wrapper pins 9.8.2), Kotlin 2.4.21,
# Compose BOM 2026.09.00 (Compose 1.12.1), Media3 1.11.1, Cloudy 0.7.1 (pinned by
# ADR-0005; 1.0.0-alpha01 is the only newer release), JNA 5.19.1.
# Shell dependencies are limited on purpose (repo-layout: a CI check allowlists them).
# Google Play Billing 9.1.0 (2026-06-18, checked 2026-11-17 on developer.android.com: the newest
# release; Play requires 8.0.0 or later for updates) is the store glue's vendor SDK (ADR-0021).

[versions]
agp = "9.5.0"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity = "1.13.0"
androidx-core = "1.19.1"
lifecycle = "2.11.0"
media3 = "1.11.1"
browser = "1.10.0"
cloudy = "0.7.1"
jna = "5.19.1"
coroutines = "1.11.0"
serialization = "1.12.0"
qrcodegen = "1.8.0"
billing = "9.1.0"

[libraries]
# Build logic: the root buildscript classpath (AGP only when an Android SDK is present). Modules
# apply org.jetbrains.kotlin.jvm, org.jetbrains.kotlin.plugin.compose, com.android.application and
# com.android.library by id.
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradle = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Pure Kotlin (:logic)
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
qrcodegen = { module = "io.nayuki:qrcodegen", version.ref = "qrcodegen" }

# Android (:app, :core-bindings)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-animation = { module = "androidx.compose.animation:animation" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
cloudy = { module = "com.github.skydoves:cloudy", version.ref = "cloudy" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# Jellyfesh Pro in Google Play builds (the store glue in :app).
play-billing = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }

