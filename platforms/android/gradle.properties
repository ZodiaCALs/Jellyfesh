org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
# The core's FFI crate, which :core-bindings builds with cargo-ndk (libjf_ffi.so, loaded by JNA as
# jf_ffi). Override with -P on the command line if the crate is renamed.
jellyfesh.coreCrate=jf-ffi
