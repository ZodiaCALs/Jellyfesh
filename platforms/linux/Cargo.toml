[package]
name = "jellyfesh-gtk"
description = "Jellyfesh for Linux: a GTK 4 and libadwaita app over the jf-core facade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "jellyfesh"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Like every shell, the app talks only to the core facade (ADR-0001).
jf-core.workspace = true
# Motion curves and sizes in code come from the generated token constants;
# the plain view logic (geometry, motion plans) uses them too, so they are
# here for every platform.
jf-tokens.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# GTK, libadwaita, gettext and D-Bus exist only on Linux; elsewhere the crate
# builds its plain view logic (and its tests) and a stub binary.
[target.'cfg(target_os = "linux")'.dependencies]
async-channel.workspace = true
gettext-rs.workspace = true
adw.workspace = true
gdk4-x11.workspace = true
gtk.workspace = true
# AI Lyrics on this device (ADR-0019 §5): whisper.cpp's recogniser as the
# core's Config::speech. Building it needs CMake and libclang; packaging
# builds it without CPU tuning (GGML_NATIVE=OFF).
jf-speech = { path = "../../core/jf-speech", default-features = false, features = ["whisper"] }
mpris-server.workspace = true
qrcode.workspace = true
x11rb.workspace = true

[build-dependencies]
serde_json.workspace = true
# Called only when building for Linux. The build script is compiled for the
# host whatever the target, and this crate is plain Rust with no system
# libraries, so it is a build dependency everywhere.
glib-build-tools.workspace = true
