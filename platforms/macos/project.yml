# XcodeGen spec for the macOS app (docs/macos.md). `scripts/build.sh` runs the whole build; to
# work in Xcode, run it once (or its first steps) and then `xcodegen generate` here.
#
# Generated/ (git-ignored) holds what the build makes from the core:
#   JellyfeshFFI.swift            UniFFI bindings (`cargo xtask bindings --lang swift`)
#   include/                      JellyfeshFFIFFI.h and module.modulemap, the C side of the bindings
#   JellyfeshCore.xcframework     libjf_ffi.a for arm64 and x86_64
#   Tokens.swift                  design tokens (`cargo xtask tokens --target swift`)
#   Plugins/                      the official .jfpkg packages, bundled as Resources/Plugins
#
# Jellyfesh/Jellyfesh.storekit is a StoreKit configuration for local purchase tests of Jellyfesh
# Pro (org.jellyfesh.pro) when the app runs from Xcode; it is never part of a build.
name: Jellyfesh

options:
  bundleIdPrefix: org.jellyfesh
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  groupSortPosition: top
  useBaseInternationalization: false

fileGroups:
  - Jellyfesh/Jellyfesh.storekit

settings:
  base:
    MARKETING_VERSION: 0.0.6
    CURRENT_PROJECT_VERSION: 6
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    # UniFFI's Swift 6 support is partial (ADR-0002): the whole app builds in Swift 5 mode.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # The C module of the bindings (JellyfeshFFIFFI) for every target that imports JellyfeshFFI.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/include
    HEADER_SEARCH_PATHS: $(SRCROOT)/Generated/include
    # Ad-hoc signature, no team (ADR-0016: no paid developer account yet).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      # Tests link against the app's copy of JellyfeshFFI (it is a static framework).
      DEAD_CODE_STRIPPING: NO
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES

targets:
  # The generated bindings and the shared drawing-time ports (platforms/shared/swift), as their own
  # module so the mirror types (Settings, Collection, Track, …) never meet SwiftUI's names. Only
  # Jellyfesh/Sources/CoreClient imports it. Static, so the app has no embedded library for the
  # hardened runtime's library validation to reject under an ad-hoc signature.
  JellyfeshFFI:
    type: framework.static
    platform: macOS
    sources:
      - path: Generated/JellyfeshFFI.swift
        group: Generated
        optional: true
      - path: ../shared/swift/Sources
        group: Shared
    settings:
      base:
        PRODUCT_NAME: JellyfeshFFI
        PRODUCT_BUNDLE_IDENTIFIER: org.jellyfesh.JellyfeshFFI
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        # Generated code: its warnings are UniFFI's to fix.
        SWIFT_SUPPRESS_WARNINGS: YES

  Jellyfesh:
    type: application
    platform: macOS
    sources:
      - path: Jellyfesh/Sources
      - path: Jellyfesh/Resources
      - path: Generated/Tokens.swift
        group: Generated
        optional: true
      # Official plugins, installed by the core on first start (CoreConfig.bundledPlugins).
      # No `group:` here: XcodeGen makes a folder's path relative to a custom group but keeps it
      # relative to the project, so the app would copy Plugins/ instead of Generated/Plugins/.
      - path: Generated/Plugins
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: JellyfeshFFI
        embed: false
      - framework: Generated/JellyfeshCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Jellyfesh
        PRODUCT_BUNDLE_IDENTIFIER: org.jellyfesh.Jellyfesh
        # Core features the generated bindings have (scripts/build.sh sets JF_BUNDLED_PLUGINS).
        JF_SWIFT_CONDITIONS: ""
        # Edition and distribution (ADR-0021, docs/github.md). scripts/build.sh sets all three from
        # JF_EDITION (community, commercial) and JF_DISTRIBUTION (source, direct, app-store); a build
        # in Xcode is the community edition from source. The app reads them as the Info.plist keys
        # JFEdition and JFDistribution, or as the Swift conditions JF_EDITION_<EDITION> and
        # JF_DISTRIBUTION_<DISTRIBUTION> (upper case, "-" as "_", e.g. JF_DISTRIBUTION_APP_STORE).
        JF_EDITION: community
        JF_DISTRIBUTION: source
        JF_EDITION_CONDITIONS: JF_EDITION_COMMUNITY JF_DISTRIBUTION_SOURCE
        # The website About links to, with the third-party licences it publishes
        # (THIRD_PARTY_NOTICES.html, tools/release/build_site.py), read as the Info.plist key JFWebsite.
        # scripts/build.sh sets it from JF_WEBSITE, else in GitHub Actions to the repository's GitHub
        # Pages address (docs/github.md); without one, About shows the version only.
        JF_WEBSITE: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(JF_SWIFT_CONDITIONS) $(JF_EDITION_CONDITIONS)
        # Carries NSAppleMusicUsageDescription: MusicKit (Apple Music, ADR-0010) terminates an app that
        # uses it without one.
        INFOPLIST_FILE: Jellyfesh/Info.plist
        # The direct download's entitlements; Mac App Store builds use the sandboxed
        # Jellyfesh-AppStore.entitlements (scripts/build.sh with JF_DISTRIBUTION=app-store).
        JF_ENTITLEMENTS: Jellyfesh/Jellyfesh.entitlements
        CODE_SIGN_ENTITLEMENTS: $(JF_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # System libraries the core's static library needs. scripts/build.sh replaces the list with
        # what rustc reports (`--print native-static-libs`) for the build at hand.
        JF_RUST_LDFLAGS: >-
          -framework CoreAudio -framework AudioToolbox -framework AudioUnit -framework AVFAudio
          -framework CoreFoundation -framework Foundation -framework CoreServices
          -framework Security -framework SystemConfiguration -framework IOKit
          -lobjc -liconv -lc++
        OTHER_LDFLAGS: $(inherited) $(JF_RUST_LDFLAGS)
    scheme:
      testTargets:
        - JellyfeshTests
      gatherCoverageData: false
      # Purchases of Jellyfesh Pro in a run from Xcode go to this local StoreKit configuration.
      storeKitConfiguration: Jellyfesh/Jellyfesh.storekit

  JellyfeshTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # The ports' contract test, replaying tests/contract/*.json from the repository.
      - path: ../shared/swift/Tests
        group: SharedTests
    dependencies:
      - target: Jellyfesh
      # Built first and imported, but not linked: the test bundle uses the app's copy.
      - target: JellyfeshFFI
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.jellyfesh.JellyfeshTests
        GENERATE_INFOPLIST_FILE: YES
        # Hosted in the app: `@testable import Jellyfesh` and the bindings resolve against it.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Jellyfesh.app/Contents/MacOS/Jellyfesh
        BUNDLE_LOADER: $(TEST_HOST)
