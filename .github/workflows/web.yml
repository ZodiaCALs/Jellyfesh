name: Web

# Jellyfesh Web (docs/web.md). On pull requests and pushes: builds core/jf-web and platforms/web
# and runs their tests, end to end against mock Subsonic and Jellyfin servers. On pushes to main,
# and when started by hand or by release.yml after a release: deploys the website
# (tools/release/build_site.py) to GitHub Pages, with Jellyfesh Web at /app/ and the download list
# of the latest release. It deploys only while Pages is on with "GitHub Actions" as the source;
# otherwise the deploy is skipped with a warning that says how to turn it on (on GitHub Free,
# Pages needs a public repository). Secret: JF_PLUGIN_SIGNING_KEY (as in release.yml); without it
# the plugins in the deployed app are unsigned and show as Community. Variables for the deployed
# app (docs/github.md): JF_LICENCE_PUBLIC_KEYS, and JF_PRO_PREVIEW (0 ends Pro Preview there).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ALSA headers
        # jf-web's tests compare its rules with jf-core's and jf-engine's, which link ALSA.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platforms/web/package-lock.json
      - name: Rust tests of the web crates and what they build on
        run: >-
          cargo test --locked -p jf-web -p jf-web-media -p jf-web-sandbox
          -p jf-plugin-model -p jf-session
      - name: wasm-bindgen CLI (the version in Cargo.lock)
        run: >-
          cargo install wasm-bindgen-cli --locked
          --version "$(node platforms/web/scripts/build-wasm.mjs --bindgen-version)"
      - name: Official plugins (unsigned)
        run: plugins/release.sh
      - name: Install
        working-directory: platforms/web
        run: npm ci
      - name: Build (tokens, WebAssembly, plugins, app)
        working-directory: platforms/web
        run: npm run build
      - name: Type check
        working-directory: platforms/web
        run: npm run check
      - name: Unit tests
        working-directory: platforms/web
        run: npm test
      - name: Chromium for the end-to-end tests
        working-directory: platforms/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the mock servers
        working-directory: platforms/web
        run: npm run test:e2e
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: platforms/web/playwright-report
          retention-days: 7

  pages:
    name: Is GitHub Pages on?
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # 404: Pages is off (or not available, as for a private repository on GitHub Free).
          # Any other error stops here, so a wrong answer never skips a deploy unnoticed.
          if build_type=$(gh api "repos/$REPO/pages" --jq '.build_type' 2> error.txt); then
            :
          elif grep -q 'HTTP 404' error.txt; then
            build_type=off
          else
            cat error.txt >&2
            exit 1
          fi
          if [ "$build_type" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ "$build_type" = off ]; then now="GitHub Pages is off"; else now="GitHub Pages builds from a branch"; fi
          echo "::warning title=Website not deployed::$now, so the website was not deployed. Settings → Pages → Build and deployment → Source: GitHub Actions, then run this workflow again. On GitHub Free, Pages needs a public repository."

  deploy:
    name: Deploy the website
    needs: [test, pages]
    if: needs.pages.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      # The Jellyfesh Web the website serves is a commercial build, like the releases' (docs/github.md):
      # Pro Preview unless the repository variable JF_PRO_PREVIEW is 0, and the licence keys'
      # public keys from the variable JF_LICENCE_PUBLIC_KEYS.
      JF_EDITION: commercial
      VITE_JF_EDITION: commercial
      VITE_JF_DISTRIBUTION: web
      JF_PRO_PREVIEW: ${{ vars.JF_PRO_PREVIEW || '1' }}
      JF_LICENCE_PUBLIC_KEYS: ${{ vars.JF_LICENCE_PUBLIC_KEYS }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platforms/web/package-lock.json
      - name: wasm-bindgen CLI (the version in Cargo.lock)
        run: >-
          cargo install wasm-bindgen-cli --locked
          --version "$(node platforms/web/scripts/build-wasm.mjs --bindgen-version)"
      - name: Official plugins, signed when the key is set
        env:
          JF_PLUGIN_SIGNING_KEY: ${{ secrets.JF_PLUGIN_SIGNING_KEY }}
        run: plugins/release.sh
      - name: Jellyfesh Web
        working-directory: platforms/web
        run: npm ci && npm run build
      - name: Download list of the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          list=none
          tag=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty' || true)
          mkdir -p release
          if [ -n "$tag" ]; then
            if gh release download "$tag" --pattern SHA256SUMS.txt --dir release; then
              # From 0.0.7: one file per platform and SHA256SUMS.txt (release.yml).
              gh release view "$tag" --json assets > release/assets.json
              list=assets
              version="${tag#v}"
            elif gh release download "$tag" --pattern "jellyfesh-site-$tag.zip" --dir release; then
              # Earlier releases carried the website with its download list.
              unzip -q "release/jellyfesh-site-$tag.zip" site/releases.json -d release
              list=site
              version="${tag#v}"
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "list=$list"
          } >> "$GITHUB_OUTPUT"
      - name: Third-party notices for the website
        run: python3 tools/licenses/generate.py
      - name: Website with Jellyfesh Web at /app/
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          LIST: ${{ steps.release.outputs.list }}
        shell: bash
        run: |
          case "$LIST" in
            assets)
              python3 tools/release/build_site.py "$VERSION" --app platforms/web/dist \
                --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
                --release-assets release/assets.json --sums release/SHA256SUMS.txt
              ;;
            site)
              python3 tools/release/build_site.py "$VERSION" --app platforms/web/dist \
                --releases release/site/releases.json
              ;;
            *) python3 tools/release/build_site.py "$VERSION" --app platforms/web/dist ;;
          esac
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v5
