name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: the workspace's debug build is otherwise larger
  # than a runner's free disk, and tests need none.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # The Linux app (jellyfesh-gtk) needs GTK 4 and libadwaita, which only the
      # Linux runner has; elsewhere the rest of the workspace is checked.
      EXCLUDE: ${{ matrix.os != 'ubuntu-24.04' && '--exclude jellyfesh-gtk' || '' }}
    steps:
      - name: More disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - name: ALSA, GTK 4 and libadwaita headers, CMake and libclang
        if: runner.os == 'Linux'
        # The Linux app (platforms/linux) targets GTK 4.14 and libadwaita 1.5, as on 24.04.
        # jf-ffi builds whisper.cpp (core/jf-speech, feature whisper): CMake, and libclang for
        # bindgen. macOS and Windows runners have both.
        run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          libgtk-4-dev libadwaita-1-dev gettext cmake libclang-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: whisper.cpp with the static C runtime
        if: runner.os == 'Windows'
        shell: bash
        # whisper-rs-sys (core/jf-speech, feature whisper) passes CMAKE_* variables to its CMake
        # build. There the cmake crate keeps CMake's default /MD for the configuration it builds
        # in a debug build, while Rust links the C runtime statically (.cargo/config.toml), and in
        # a release build replaces the release flags with its own, without /O2. The same as
        # windows-app below; dashes, not slashes, so Git Bash leaves the flags alone.
        run: |
          {
            echo "CMAKE_POLICY_DEFAULT_CMP0091=NEW"
            echo "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
            echo "CMAKE_C_FLAGS_RELEASE=-O2 -Ob2 -DNDEBUG"
            echo "CMAKE_CXX_FLAGS_RELEASE=-O2 -Ob2 -DNDEBUG"
          } >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace $EXCLUDE --all-targets -- -D warnings
      - name: Tests
        shell: bash
        # Every test binary runs even after one fails, so a run lists all its failures.
        run: cargo test --workspace $EXCLUDE --no-fail-fast
      - run: cargo xtask tokens --check

  licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The release's packaging scripts, with no secret (docs/store-release.md): shellcheck, the
  # PowerShell parser, the dry runs that work on Linux (each signing script skips with a notice),
  # and the website's legal pages against legal/.
  packaging:
    name: Packaging scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: >-
          shellcheck --severity=warning plugins/release.sh platforms/macos/scripts/*.sh
          platforms/android/scripts/build.sh platforms/linux/packaging/*.sh
      - name: The PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem platforms/windows/scripts/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              "::error file=$($script.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Signing and store scripts without their secrets
        run: |
          platforms/macos/scripts/keychain.sh "$RUNNER_TEMP/signing.env"
          platforms/macos/scripts/notarize.sh Jellyfesh.dmg
          platforms/macos/scripts/package-mas.sh Jellyfesh.app Jellyfesh.pkg
      - name: Editions in install.sh (the commercial one leaves the community plugins out)
        run: |
          mkdir -p dist/plugins
          touch dist/plugins/org.jellyfesh.subsonic.jfpkg dist/plugins/community.unofficial.netease.jfpkg
          for edition in commercial community; do
            JF_EDITION=$edition platforms/linux/packaging/install.sh --binary /bin/true \
              --prefix /app --destdir "$RUNNER_TEMP/$edition"
          done
          test -f "$RUNNER_TEMP/commercial/app/share/jellyfesh/plugins/org.jellyfesh.subsonic.jfpkg"
          test ! -e "$RUNNER_TEMP/commercial/app/share/jellyfesh/plugins/community.unofficial.netease.jfpkg"
          test -f "$RUNNER_TEMP/community/app/share/jellyfesh/plugins/community.unofficial.netease.jfpkg"
      - name: The release's text
        run: |
          mkdir -p "$RUNNER_TEMP/files"
          touch "$RUNNER_TEMP/files/Jellyfesh-0.0.0-macOS.dmg"
          python3 tools/release/release_body.py --version 0.0.0 --tag v0.0.0 \
            --repository "$GITHUB_REPOSITORY" --files "$RUNNER_TEMP/files" --pro-preview
      - name: The website's legal pages match legal/
        run: python3 tools/release/legal_pages.py --check

  # Plays generated albums through jf's real audio-device path on a runner
  # without a sound card (PulseAudio virtual speaker), records it and checks
  # gapless joins, dropouts and pitch. See tools/cloud-audio-check/run.sh.
  audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Audio tools
        run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev pulseaudio
          pulseaudio-utils libasound2-plugins flac lame vorbis-tools
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p jf-cli
      - run: tools/cloud-audio-check/run.sh target/release/jf

  # On-device speech recognition (core/jf-speech, ADR-0019 §5): whisper.cpp with the Tiny model
  # on a sentence spoken by espeak-ng (tests/whisper_smoke.rs). The model comes from Hugging
  # Face, cached under its SHA-1 and checked against it; the log shows its SHA-256 for the
  # catalogue (core/jf-speech/src/catalogue.rs).
  speech:
    runs-on: ubuntu-24.04
    env:
      TINY_SHA1: bd577a113a864445d4c299885e0cb97d4ba92b5f
      # As in the shipped builds: no tuning for this runner's CPU. A native build picked
      # up AMX on a runner that offers it, and ggml then stopped with "AMX is not ready
      # to be used!" (CI, 2026-11-20).
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v7
      - name: espeak-ng, FFmpeg, CMake and libclang (bindgen in whisper-rs-sys)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg cmake libclang-dev
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Speech to recognise
        run: |
          mkdir -p "$RUNNER_TEMP/speech"
          espeak-ng -v en-us -s 140 -w "$RUNNER_TEMP/speech/espeak.wav" \
            "Hello world. This is a test of speech recognition on this device."
          ffmpeg -hide_banner -loglevel error -i "$RUNNER_TEMP/speech/espeak.wav" \
            -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/speech/hello.wav"
          echo "JF_WHISPER_WAV=$RUNNER_TEMP/speech/hello.wav" >> "$GITHUB_ENV"
      - name: The Tiny model from the cache
        uses: actions/cache@v6
        with:
          path: ~/whisper-models/ggml-tiny.bin
          key: whisper-ggml-tiny-${{ env.TINY_SHA1 }}
      - name: Download and verify the Tiny model
        run: |
          model="$HOME/whisper-models/ggml-tiny.bin"
          if [ ! -f "$model" ]; then
            mkdir -p "$(dirname "$model")"
            curl -fsSL --retry 5 --retry-all-errors -o "$model.part" \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
            mv "$model.part" "$model"
          fi
          echo "$TINY_SHA1  $model" | sha1sum -c -
          sha256=$(sha256sum "$model" | cut -d ' ' -f 1)
          echo "ggml-tiny.bin: $(stat -c %s "$model") bytes, SHA-256 $sha256"
          echo "::notice title=ggml-tiny.bin SHA-256::$sha256"
          echo "JF_WHISPER_MODEL=$model" >> "$GITHUB_ENV"
      - name: Tests with whisper.cpp
        run: cargo test -p jf-speech --features whisper
      - name: Recognition smoke test
        env:
          JF_WHISPER_MODEL_ID: tiny
          # Whisper Tiny hears espeak's "Hello" as "the long" (CI, 2026-11-18); the
          # words below came through, and still prove recognition and timing.
          JF_WHISPER_EXPECT: world,test,speech,recognition,device
        run: cargo test -p jf-speech --features whisper --test whisper_smoke -- --ignored --nocapture

  # The Kotlin and C# bindings against the real core (docs/ffi.md, "Tests").
  bindings:
    name: Kotlin and C# bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ALSA headers, CMake and libclang (whisper.cpp in jf-ffi)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake libclang-dev
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Kotlin on the JVM
        run: >-
          cargo xtask bindings --lang kotlin && cargo xtask tokens --target kotlin &&
          gradle -p platforms/shared/kotlin test
      - name: C# on .NET 10
        run: >-
          cargo build -p jf-ffi && cargo xtask tokens --target csharp &&
          dotnet test --project platforms/shared/csharp/Jellyfesh.Tests

  # The macOS app has no other compiler than this job (docs/macos.md).
  macos-app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: platforms/macos/scripts/build.sh --test

  # The WinUI app compiles only on Windows; its portable projects are tested too.
  windows-app:
    name: Windows app
    runs-on: windows-2025
    env:
      # For whisper.cpp once jf-ffi builds it (core/jf-speech, feature whisper): the static C
      # runtime and optimised release flags (see the check job).
      CMAKE_POLICY_DEFAULT_CMP0091: NEW
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      CMAKE_C_FLAGS_RELEASE: -O2 -Ob2 -DNDEBUG
      CMAKE_CXX_FLAGS_RELEASE: -O2 -Ob2 -DNDEBUG
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build (platforms/windows/scripts/build.ps1)
        shell: pwsh
        run: platforms/windows/scripts/build.ps1
      # What the publish ships (the installer holds both folders): each architecture's size with
      # its five largest files, then each zip's size.
      - name: Size of the published app
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            $app = Join-Path $PWD "platforms/windows/publish/$rid/Jellyfesh"
            if (-not (Test-Path $app)) { continue }
            $files = @(Get-ChildItem $app -Recurse -File)
            $total = ($files | Measure-Object -Property Length -Sum).Sum
            '{0}: {1:N1} MiB in {2} files' -f $rid, ($total / 1MB), $files.Count
            $files | Sort-Object Length -Descending | Select-Object -First 5 | ForEach-Object {
              '  {0,7:N1} MiB  {1}' -f ($_.Length / 1MB), [IO.Path]::GetRelativePath($app, $_.FullName)
            }
          }
          Get-ChildItem platforms/windows/artifacts -Filter '*.zip' -ErrorAction SilentlyContinue | ForEach-Object {
            '{0}: {1:N1} MiB' -f $_.Name, ($_.Length / 1MB)
          }
      - name: Portable tests
        run: dotnet test --solution platforms/windows/Jellyfesh.Portable.slnf

  # The published Windows app starts (docs/windows.md, "When Jellyfesh does not start"):
  # Jellyfesh.exe --smoke-test starts the core and the main window, opens every page and closes,
  # from the publish folder with the default folders, then from a path with spaces and non-ASCII
  # characters with its data, cache and log there too. The app's log is printed after each run,
  # and the event log's entries after a failed one; the logs are kept as an artifact.
  windows-smoke:
    name: Windows app starts
    runs-on: windows-latest
    env:
      # whisper.cpp in jf-ffi, as in windows-app (build.ps1 sets them too).
      CMAKE_POLICY_DEFAULT_CMP0091: NEW
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      CMAKE_C_FLAGS_RELEASE: -O2 -Ob2 -DNDEBUG
      CMAKE_CXX_FLAGS_RELEASE: -O2 -Ob2 -DNDEBUG
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build for x64 (platforms/windows/scripts/build.ps1)
        shell: pwsh
        run: platforms/windows/scripts/build.ps1 -Architectures x64
      - name: Start it (platforms/windows/scripts/smoke-test.ps1)
        shell: pwsh
        timeout-minutes: 20
        run: platforms/windows/scripts/smoke-test.ps1 -DefaultFolders -WorkDir "$env:RUNNER_TEMP\jellyfesh-smoke"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-logs
          path: ${{ runner.temp }}/jellyfesh-smoke/logs/
          if-no-files-found: ignore

  # The Android app: logic tests on the JVM, then the APK (docs/android.md).
  android-app:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ALSA headers (host build of the bindings), CMake and libclang (whisper.cpp in jf-ffi)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake libclang-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Caches Gradle's downloads (saved by runs on main, read by the others), so a run
      # doesn't fetch every dependency from Maven Central again and get throttled (HTTP 429).
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Android platform 37, newest build tools and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          list=$(sdkmanager --list 2>/dev/null)
          # API 37's platform is listed as android-37.0 (minor versions 37.x follow),
          # older repositories as android-37: take the base one the list offers.
          platforms=$(grep -oE 'platforms;android-37(\.[0-9]+)?' <<< "$list" | sort -uV)
          platform=$(grep -xE 'platforms;android-37(\.0)?' <<< "$platforms" | head -1)
          platform=${platform:-$(head -1 <<< "$platforms")}
          if [ -z "$platform" ]; then
            echo "::error::The SDK lists no API 37 platform"
            exit 1
          fi
          build_tools=$(grep -oE 'build-tools;37\.[0-9.]+' <<< "$list" | sort -V | tail -1)
          ndk=$(grep -oE 'ndk;[0-9]+\.[0-9.]+' <<< "$list" | grep -v rc | sort -V | tail -1)
          echo "installing $platform $build_tools $ndk"
          sdkmanager --install "$platform" "$build_tools" "$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ndk#ndk;}" >> "$GITHUB_ENV"
          echo "APKSIGNER=$ANDROID_HOME/build-tools/${build_tools#build-tools;}/apksigner" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Logic tests
        working-directory: platforms/android
        run: ./gradlew :logic:test
      - name: Build the APK (platforms/android/scripts/build.sh)
        run: platforms/android/scripts/build.sh

