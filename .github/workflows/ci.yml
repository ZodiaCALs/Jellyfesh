name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: the workspace's debug build is otherwise larger
  # than a runner's free disk, and tests need none.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # The Linux app (jellyfesh-gtk) needs GTK 4 and libadwaita, which only the
      # Linux runner has; elsewhere the rest of the workspace is checked.
      EXCLUDE: ${{ matrix.os != 'ubuntu-24.04' && '--exclude jellyfesh-gtk' || '' }}
    steps:
      - name: More disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - name: ALSA, GTK 4 and libadwaita headers
        if: runner.os == 'Linux'
        # The Linux app (platforms/linux) targets GTK 4.14 and libadwaita 1.5, as on 24.04.
        run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          libgtk-4-dev libadwaita-1-dev gettext
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace $EXCLUDE --all-targets -- -D warnings
      - name: Tests
        shell: bash
        # Every test binary runs even after one fails, so a run lists all its failures.
        run: cargo test --workspace $EXCLUDE --no-fail-fast
      - run: cargo xtask tokens --check

  licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Plays generated albums through jf's real audio-device path on a runner
  # without a sound card (PulseAudio virtual speaker), records it and checks
  # gapless joins, dropouts and pitch. See tools/cloud-audio-check/run.sh.
  audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Audio tools
        run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev pulseaudio
          pulseaudio-utils libasound2-plugins flac lame vorbis-tools
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p jf-cli
      - run: tools/cloud-audio-check/run.sh target/release/jf

  # The Kotlin and C# bindings against the real core (docs/ffi.md, "Tests").
  bindings:
    name: Kotlin and C# bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Kotlin on the JVM
        run: >-
          cargo xtask bindings --lang kotlin && cargo xtask tokens --target kotlin &&
          gradle -p platforms/shared/kotlin test
      - name: C# on .NET 10
        run: >-
          cargo build -p jf-ffi && cargo xtask tokens --target csharp &&
          dotnet test --project platforms/shared/csharp/Jellyfesh.Tests

  # The macOS app has no other compiler than this job (docs/macos.md).
  macos-app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: platforms/macos/scripts/build.sh --test

  # The WinUI app compiles only on Windows; its portable projects are tested too.
  windows-app:
    name: Windows app
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build (platforms/windows/scripts/build.ps1)
        shell: pwsh
        run: platforms/windows/scripts/build.ps1
      - name: Portable tests
        run: dotnet test --solution platforms/windows/Jellyfesh.Portable.slnf

  # The Android app: logic tests on the JVM, then the APK (docs/android.md).
  android-app:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ALSA headers (host build of the bindings)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Android platform 37, newest build tools and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          list=$(sdkmanager --list 2>/dev/null)
          # API 37's platform is listed as android-37.0 (minor versions 37.x follow),
          # older repositories as android-37: take the base one the list offers.
          platforms=$(grep -oE 'platforms;android-37(\.[0-9]+)?' <<< "$list" | sort -uV)
          platform=$(grep -xE 'platforms;android-37(\.0)?' <<< "$platforms" | head -1)
          platform=${platform:-$(head -1 <<< "$platforms")}
          if [ -z "$platform" ]; then
            echo "::error::The SDK lists no API 37 platform"
            exit 1
          fi
          build_tools=$(grep -oE 'build-tools;37\.[0-9.]+' <<< "$list" | sort -V | tail -1)
          ndk=$(grep -oE 'ndk;[0-9]+\.[0-9.]+' <<< "$list" | grep -v rc | sort -V | tail -1)
          echo "installing $platform $build_tools $ndk"
          sdkmanager --install "$platform" "$build_tools" "$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ndk#ndk;}" >> "$GITHUB_ENV"
          echo "APKSIGNER=$ANDROID_HOME/build-tools/${build_tools#build-tools;}/apksigner" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Logic tests
        working-directory: platforms/android
        run: ./gradlew :logic:test
      - name: Build the APK (platforms/android/scripts/build.sh)
        run: platforms/android/scripts/build.sh

