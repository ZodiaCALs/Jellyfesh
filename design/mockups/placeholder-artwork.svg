<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Placeholder artwork (sample content for design mock-ups; not a real album)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#441236"/>
      <stop offset="1" stop-color="#97271b"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.07 0"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="700" cy="290" r="210" fill="#8a57ae" opacity="0.65" filter="url(#soft)"/>
  <circle cx="390" cy="450" r="270" fill="#f07456" opacity="0.88"/>
  <circle cx="650" cy="640" r="205" fill="#f5b75b" opacity="0.82"/>
  <circle cx="520" cy="560" r="120" fill="#d85164" opacity="0.55" filter="url(#soft)"/>
  <path d="M120 820 C 330 760, 560 880, 900 800" fill="none" stroke="#fcf7f6" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
  <path d="M120 870 C 330 810, 560 930, 900 850" fill="none" stroke="#fcf7f6" stroke-opacity="0.3" stroke-width="10" stroke-linecap="round"/>
  <text x="72" y="960" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="8" fill="#fcf7f6" fill-opacity="0.55">SAMPLE ART</text>
  <rect width="1024" height="1024" filter="url(#grain)"/>
</svg>
