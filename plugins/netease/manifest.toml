id = "org.jellyfesh.netease"
name = "NetEase Cloud Music"
version = "0.0.8"
api_version = "1.3"
author = "Jellyfesh"
description = "Your NetEase Cloud Music playlists, with your own open-platform developer credentials"
official = true
# No search yet: its path is not in what the open platform's client shows,
# and NetEase's API documentation was not available to us. Discover shows the
# account's own lists; details are a playlist's. Library: the liked songs and
# the created and collected playlists.
capabilities = ["auth", "browse", "resolve_stream", "discover", "details", "library"]
playback_mode = "stream"
# A form for your App ID and private key, then a QR code for the app.
auth = ["qr"]
# No [links]: a song has an encrypted id for the API and a numeric one for
# links, and a link template takes one id.

[network]
# The open platform's API, and NetEase's audio servers (*.music.126.net is
# not confirmed by the documentation; stream URLs elsewhere are refused).
allow = ["openncm.music.163.com", "*.music.126.net"]
max_rps = 5

[settings]
schema = "settings.schema.json"

[content_policy]
# The open platform's caching rules are not known: metadata may be kept,
# audio never.
library_storage = "metadata"
# The levels the player bar's quality menu offers (ADR-0026). NetEase's
# lowest is 128 kbit/s, which Low and Normal both ask for.
qualities = ["lossless", "high", "normal", "low"]
