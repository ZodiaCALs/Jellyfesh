[package]
name = "jf-netease"
description = "Jellyfesh source plugin for NetEase Cloud Music's open platform: your playlists and streams, with your own developer credentials and a signed QR sign-in."
# The plugin's own version: keep it equal to `version` in manifest.toml.
version = "0.0.8"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
jf-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jf-plugin-host.workspace = true
jf-plugin-testkit.workspace = true
# The mock makes a test key pair and checks every request's signature.
rsa.workspace = true
getrandom = { workspace = true, features = ["sys_rng"] }
sha2.workspace = true
base64.workspace = true
