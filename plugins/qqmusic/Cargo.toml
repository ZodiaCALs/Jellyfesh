[package]
name = "jf-qqmusic"
description = "Jellyfesh source plugin for QQ Music's open API (qqmusic-skills): search, browse and recommendations with links that open QQ Music."
# The plugin's own version: keep it equal to `version` in manifest.toml.
version = "0.0.7"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
jf-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jf-plugin-host.workspace = true
jf-plugin-testkit.workspace = true
