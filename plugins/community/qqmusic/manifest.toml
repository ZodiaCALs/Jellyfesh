id = "community.unofficial.qqmusic"
name = "QQ Music (Unofficial)"
version = "0.1.3"
api_version = "1.3"
author = "ZodiaCALs"
description = "Unofficial community plugin, not made or endorsed by Tencent or Jellyfesh. Plays only what your account may play. Not yet tested against the live service."
official = false
capabilities = ["auth", "search", "browse", "resolve_stream", "lyrics", "artwork", "discover", "details", "library"]
playback_mode = "stream"
auth = ["qr"]

[network]
# The web player's API (u.y.qq.com), WeChat's web sign-in (open.weixin.qq.com
# and its long poll, lp.open.weixin.qq.com), the stream hosts
# (ws.stream.qqmusic.qq.com, …) and the picture hosts. Nothing else.
allow = [
    "u.y.qq.com",
    "open.weixin.qq.com",
    "lp.open.weixin.qq.com",
    "*.stream.qqmusic.qq.com",
    "y.gtimg.cn",
    "qpic.y.qq.com",
]
# Browsing a page takes one or two requests; stay well below the host's cap.
max_rps = 5

[settings]
schema = "settings.schema.json"

[content_policy]
# Streams are for this account only: Jellyfesh may keep track details in its
# library, but never the audio.
library_storage = "metadata"
# The levels the player bar's quality menu offers (ADR-0026): FLAC, MP3 at
# 320 and 128 kbit/s and AAC at 96, each falling back to the files below it
# that the service grants this account.
qualities = ["lossless", "high", "normal", "low"]
