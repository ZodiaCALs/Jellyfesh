[package]
name = "jf-community-qqmusic"
description = "QQ Music (Unofficial): a community source plugin for Jellyfesh, on the y.qq.com web player's endpoints. Not made or endorsed by Tencent."
# The plugin's own version: keep it equal to `version` in manifest.toml.
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
# For the integration tests only: talk to the test suite's mock service
# (setting `mock_origin`). plugins/release.sh never turns it on, and the
# published settings schema has no `mock_origin`, so published packages
# cannot.
mock-service = []

[dependencies]
jf-plugin-sdk.workspace = true
jf-community-common.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jf-plugin-host.workspace = true
jf-community-testsupport.workspace = true
# The mock checks every request's signature (MD5).
md-5.workspace = true
